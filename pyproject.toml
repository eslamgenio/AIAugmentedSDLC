[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-pilot"
version = "0.1.0"
description = "Local artifact storage and validation for the SDLC test design pilot"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
sdlc-pilot = "sdlc_pilot.cli:main"

[tool.setuptools]
packages = ["sdlc_pilot"]

[tool.setuptools.package-data]
sdlc_pilot = ["contracts.schema.json", "shipping-oracle.json"]
